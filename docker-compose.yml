services:
  db:
    image: postgres:16-alpine
    container_name: scripta_db
    restart: always
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db_name
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_user -d db_name"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: scripta_server
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://db_user:password@db:5432/db_name?sslmode=disable
    ports:
      - "4000:4000"

  client:
    build: ./client
    container_name: scripta_client
    restart: always
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  postgres_data: